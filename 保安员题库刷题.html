<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保安员题库刷题</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='44' rx='10' fill='%23173A5E'/%3E%3Cpath d='M22 36l7 7 15-18' stroke='%23F5A623' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ===== 基础 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#173A5E; --navy-deep:#0F2B47; --ink:#22303C; --sub:#67788A;
  --bg:#EEF2F7; --card:#FFFFFF; --line:#E2E8F0;
  --ok:#1E8E4E; --ok-bg:#E7F5EC; --bad:#D14343; --bad-bg:#FBEAEA;
  --amber:#F5A623; --amber-bg:#FDF3E0;
}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}

/* ===== 顶栏 ===== */
header.topbar{background:var(--navy);color:#fff;padding:12px 14px 10px;flex:none}
.topbar .title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.topbar .title svg{flex:none}
.topbar .sub{font-size:12px;color:#B9C9DC;margin-top:2px;padding-left:2px}

/* ===== Tab 栏 ===== */
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);flex:none;display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .tab{flex:none;min-width:76px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;padding:0 10px;min-height:46px}
nav.tabs .tab b{font-size:11px;font-weight:600;opacity:.75}
nav.tabs .tab.on{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
nav.tabs .tab.on b{color:var(--amber);opacity:1}

/* ===== 主区 ===== */
main#main{flex:1;overflow-y:auto;padding:12px 12px 92px;-webkit-overflow-scrolling:touch}
.sec-title{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:4px 2px 8px}
.sec-title .more{color:var(--navy);font-weight:600}

/* 组卡片 */
.gcard{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(23,58,94,.06);cursor:pointer;display:block;width:100%;text-align:left}
.gcard .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.gcard .gn{font-size:15px;font-weight:700;color:var(--navy)}
.gcard .gstat{font-size:12px;color:var(--sub)}
.gcard .gstat.ok{color:var(--ok);font-weight:600}
.gbar{height:6px;border-radius:3px;background:#E7ECF3;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--navy)}
.gbar i.done{background:var(--ok)}

/* 列表项（错题本/收藏） */
.item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(23,58,94,.06);cursor:pointer;display:block;width:100%;text-align:left}
.item .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 8px;border-radius:10px;background:#EAF0F8;color:var(--navy);font-weight:600;margin-bottom:6px}
.item .tag.fav{background:var(--amber-bg);color:#B07A00}
.item .st{display:block;font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .ansrow{margin-top:8px;font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
.item .ansrow .u{color:var(--bad)}
.item .ansrow .c{color:var(--ok);font-weight:600}

/* 空态 */
.empty{text-align:center;color:var(--sub);padding:56px 20px;font-size:14px}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px;color:#C6D2E0}

/* ===== 答题区 ===== */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qhead .pos{font-size:16px;font-weight:700;color:var(--navy)}
.qhead .pos small{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.favbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#C6D2E0;flex:none}
.favbtn.on{color:var(--amber)}
.qdots{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.qdots i{width:14px;height:14px;border-radius:50%;background:#E2E8F0;cursor:pointer}
.qdots i.on{background:var(--navy)}
.qdots i.ok{background:var(--ok)}
.qdots i.bad{background:var(--bad)}
.qcard{background:var(--card);border-radius:12px;padding:14px 14px 16px;box-shadow:0 1px 3px rgba(23,58,94,.06)}
.qtype{display:inline-flex;font-size:11px;font-weight:600;color:#fff;background:var(--navy);border-radius:10px;padding:2px 9px;margin-bottom:10px}
.qtype.multi{background:#7A4BB0}
.qstem{font-size:16px;font-weight:600;color:var(--ink);line-height:1.7;word-break:break-word}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:50px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:15px;color:var(--ink);text-align:left;line-height:1.5;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt .letter{flex:none;width:26px;height:26px;border-radius:50%;background:#EAF0F8;color:var(--navy);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .txt{flex:1;word-break:break-word}
.opt.sel{border-color:var(--amber);background:var(--amber-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .letter{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt.dim{opacity:.72}
.opt:disabled{cursor:default;opacity:1}
.explain{margin-top:12px;border-radius:10px;padding:12px 13px;background:#F7F9FC;border:1px solid var(--line)}
.explain .e1{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--navy)}
.explain .e1 .tagx{font-size:11px;font-weight:600;color:var(--navy);background:#EAF0F8;border-radius:10px;padding:2px 8px;margin-left:auto}
.explain .yours{margin-top:6px;font-size:13px;color:var(--bad)}
.explain .ana{margin-top:8px;font-size:13.5px;color:var(--sub);line-height:1.7}
.explain.ok{border-color:#CDE8D6;background:var(--ok-bg)}
.explain.bad{border-color:#F2CFCF;background:var(--bad-bg)}
.submitrow{margin-top:14px}
.btn-submit{width:100%;height:48px;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700}
.btn-submit:active{background:var(--navy-deep)}

/* ===== 底部栏 ===== */
footer.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line)}
footer.bottom .in{max-width:520px;margin:0 auto;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.navbtn{flex:1;height:48px;border-radius:10px;font-size:16px;font-weight:600;border:1.5px solid var(--line);color:var(--navy);background:#fff;min-height:48px}
.navbtn.next{background:var(--navy);color:#fff;border-color:var(--navy)}
.navbtn.next:active{background:var(--navy-deep)}

/* ===== 弹窗 ===== */
#mask{position:fixed;inset:0;background:rgba(15,43,71,.55);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
#mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:340px;padding:22px 20px 18px;text-align:center;box-shadow:0 12px 40px rgba(15,43,71,.3)}
.modal h3{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:14px}
.ring{position:relative;width:120px;height:120px;margin:0 auto 12px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:26px;font-weight:800;color:var(--navy)}
.ring .num span{font-size:11px;color:var(--sub)}
.mstats{display:flex;justify-content:center;gap:26px;margin:6px 0 14px}
.mstats .m{font-size:12px;color:var(--sub)}
.mstats .m b{display:block;font-size:20px;font-weight:800;color:var(--ink)}
.mstats .m.ok b{color:var(--ok)}
.mstats .m.bad b{color:var(--bad)}
.mnote{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.btn-done{width:100%;height:48px;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;min-height:48px}
.btn-done:active{background:var(--navy-deep)}

/* ===== 模拟考试 ===== */
nav.tabs .tab.exam.on{color:#B07A00;border-bottom-color:var(--amber)}
nav.tabs .tab.exam.on b{color:var(--amber);opacity:1}
.exam-hero{background:var(--navy);border-radius:14px;color:#fff;padding:18px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.exam-hero:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--amber)}
.exam-hero h2{font-size:18px;font-weight:700;margin-bottom:6px}
.exam-hero p{font-size:13px;color:#B9C9DC;line-height:1.8}
.exam-hero .scoreline{margin-top:12px;font-size:14px;color:#fff;font-weight:700;background:rgba(255,255,255,.12);border-radius:8px;padding:8px 10px}
.btn-start{width:100%;height:50px;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;min-height:50px}
.btn-start:active{background:var(--navy-deep)}
.btn-sub{flex:1;height:50px;border-radius:10px;border:1.5px solid var(--line);color:var(--navy);font-size:15px;font-weight:600;background:#fff;min-height:50px}
.btn-sub:active{background:#F0F4F9}
.btn-row{display:flex;gap:10px}
.btn-ghost{flex:1;height:48px;border-radius:10px;border:1.5px solid var(--line);color:var(--navy);font-size:15px;font-weight:600;background:#fff;min-height:48px}
.btn-ghost:active{background:#F0F4F9}
.examsec{display:flex;align-items:baseline;gap:8px;margin:12px 2px 10px}
.examsec .secname{font-size:14px;font-weight:700;color:var(--navy)}
.examsec .secmeta{font-size:12px;color:var(--sub)}
.examprog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12.5px;color:var(--sub)}
.examprog .bar{flex:1;height:6px;border-radius:3px;background:#E7ECF3;overflow:hidden}
.examprog .bar i{display:block;height:100%;background:var(--amber)}
.btn-jiao{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--bad);border-radius:10px;font-size:13px;font-weight:700;flex:none;min-height:44px}
.btn-jiao:active{background:#B83A3A}

@media (min-width:768px){
  main#main{padding-left:16px;padding-right:16px}
  body{font-size:16px}
}
</style>
</head>

const TYPE_NAME = {judge:'判断题', single:'单选题', multi:'多选题'};
const TYPE_ORDER = ['judge','single','multi'];

/* 判断题答案统一为字母：√->A  ×->B */
const QS = RAW_DATA.map(q => {
  const lans = q.type === 'judge' ? (q.answerText === '√' ? 'A' : 'B') : q.answerText;
  return {id:q.id, type:q.type, stem:q.stem, options:q.options, ans:lans, ansText:q.answerText, topic:q.topic, analysis:q.analysis};
});
const BY_TYPE = {};
TYPE_ORDER.forEach(t => BY_TYPE[t] = QS.filter(q => q.type === t));

/* ========== 本地存储 ========== */
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const STORE = {
  progress: lsGet('quiz_progress_v1', {}),   // qid -> {u, ok}
  fav: lsGet('quiz_fav_v1', []),             // [qid]
  wrong: lsGet('quiz_wrong_v1', []),         // [qid]
  wrongAns: lsGet('quiz_wrongans_v1', {}),   // qid -> 用户答案
};
function saveStore(){ lsSet('quiz_progress_v1', STORE.progress); lsSet('quiz_fav_v1', STORE.fav); lsSet('quiz_wrong_v1', STORE.wrong); lsSet('quiz_wrongans_v1', STORE.wrongAns); }

/* ========== 状态 ========== */
const S = {
  tab: 'judge',      // judge|single|multi|exam|wrong|fav
  quiz: null,        // {src:'group'|'wrong'|'fav', type, list:[q], gIdx}
  qPos: 0,
  multiSel: [],      // 多选已选字母数组
  exam: loadExam(),  // {paper:[q], answers:{}, submitted, started} 或 null
  examPos: 0,
};

/* ========== 工具 ========== */
function groupsOf(type){ const arr = BY_TYPE[type]; const gs = []; for(let i=0;i<arr.length;i+=10){ gs.push(arr.slice(i,i+10)); } return gs; }
function isAnswered(q){ return STORE.progress[q.id] !== undefined; }
function answeredCount(list){ let n=0; list.forEach(q => { if(isAnswered(q)) n++; }); return n; }
function correctCount(list){ let n=0; list.forEach(q => { const p=STORE.progress[q.id]; if(p && p.ok) n++; }); return n; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function typeStat(type){ const n = BY_TYPE[type].length, a = BY_TYPE[type].filter(q=>isAnswered(q)).length; return n + ' 题 · 已答 ' + a; }
/* 清洗解析前缀：去掉“考点：…。正确答案：…。” */
function cleanAna(a){
  let s = String(a||'');
  s = s.replace(/^考点：[^。]+。正确答案：[^。]+。/,'');
  s = s.replace(/^考点：[^。]+。/,'');
  return s || '请结合题库标准答案与培训教材核对相应知识点。';
}
function starIcon(on){
  return on
    ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="#F5A623"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>'
    : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
}
function checkIcon(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>'; }
function xIcon(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'; }

/* ========== 渲染：顶栏 + Tab ========== */
function renderChrome(){
  const total = QS.length;
  document.getElementById('topbar').innerHTML =
    '<div class="title"><svg width="22" height="22" viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="44" rx="10" fill="#F5A623"/><path d="M22 36l7 7 15-18" stroke="#173A5E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>保安员题库刷题</div>' +
    '<div class="sub">共 ' + total + ' 题 · 判断 ' + BY_TYPE.judge.length + ' · 单选 ' + BY_TYPE.single.length + ' · 多选 ' + BY_TYPE.multi.length + '</div>';
  const tabs = TYPE_ORDER.map(t =>
    '<button class="tab' + (S.tab===t?' on':'') + '" data-tab="' + t + '">' + TYPE_NAME[t] + '<b>' + BY_TYPE[t].length + ' 题</b></button>'
  ).join('') +
    '<button class="tab exam' + (S.tab==='exam'?' on':'') + '" data-tab="exam">模拟考试<b>80 题卷</b></button>' +
    '<button class="tab' + (S.tab==='wrong'?' on':'') + '" data-tab="wrong">错题本<b id="tb-wrong">' + STORE.wrong.length + ' 题</b></button>' +
    '<button class="tab' + (S.tab==='fav'?' on':'') + '" data-tab="fav">收藏<b id="tb-fav">' + STORE.fav.length + ' 题</b></button>';
  document.getElementById('tabs').innerHTML = tabs;
  document.getElementById('tabs').querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => { S.tab = btn.dataset.tab; S.quiz = null; render(); };
  });
}

/* ========== 渲染：主区 ========== */
function render(){
  renderChrome();
  const main = document.getElementById('main');
  if (S.tab === 'exam') { renderExam(main); }
  else if (S.quiz) { renderQuiz(main); }
  else if (S.tab === 'wrong') { renderWrong(main); }
  else if (S.tab === 'fav') { renderFav(main); }
  else { renderGroups(main); }
  renderBottom();
}

function renderGroups(main){
  const type = S.tab;
  const gs = groupsOf(type);
  const html = gs.map((g, gi) => {
    const ac = answeredCount(g), cc = correctCount(g);
    const done = ac === g.length;
    const pct = done ? Math.round(cc / g.length * 100) : Math.round(ac / g.length * 100);
    return '<button class="gcard" data-g="' + gi + '">' +
      '<div class="row1"><span class="gn">第 ' + (gi+1) + ' 组</span>' +
      '<span class="gstat' + (done?' ok':'') + '">' + (done ? ('正确率 ' + pct + '%') : ('已答 ' + ac + '/' + g.length)) + '</span></div>' +
      '<div class="gbar"><i class="' + (done?'done':'') + '" style="width:' + pct + '%"></i></div>' +
      '</button>';
  }).join('');
  main.innerHTML = '<div class="sec-title"><span>' + typeStat(type) + '</span></div>' + html;
  main.querySelectorAll('.gcard').forEach(c => c.onclick = () => {
    S.quiz = {src:'group', type:type, list:gs[+c.dataset.g], gIdx:+c.dataset.g};
    S.qPos = 0; S.multiSel = [];
    render();
  });
}

function renderWrong(main){
  const list = STORE.wrong.map(id => QS.find(q => q.id === id)).filter(Boolean);
  if (!list.length) {
    main.innerHTML = '<div class="empty"><div class="big">✓</div>错题本还是空的<br>答错的题目会自动收录到这里</div>';
    return;
  }
  const html = list.map(q => {
    const p = STORE.progress[q.id];
    const u = STORE.wrongAns[q.id] !== undefined ? STORE.wrongAns[q.id] : (p ? p.u : '');
    return '<button class="item" data-id="' + q.id + '">' +
      '<span class="tag">' + TYPE_NAME[q.type] + '</span>' +
      '<span class="st">' + esc(q.stem) + '</span>' +
      '<span class="ansrow"><span class="u">你的答案 ' + esc(q.type==='judge' ? (u==='A'?'正确':'错误') : u) + '</span><span class="c">正确答案 ' + esc(q.ansText) + '</span></span>' +
      '</button>';
  }).join('');
  main.innerHTML = '<div class="sec-title"><span>共 ' + list.length + ' 道错题</span><button class="more" id="clear-wrong">清空错题本</button></div>' + html;
  main.querySelectorAll('.item').forEach(it => it.onclick = () => {
    const id = +it.dataset.id;
    S.quiz = {src:'wrong', type:'wrong', list:list, gIdx:0};
    S.qPos = list.findIndex(q => q.id === id); S.multiSel = [];
    render();
  });
  document.getElementById('clear-wrong').onclick = () => {
    if (confirm('确定清空错题本吗？清空后不可恢复。')) { STORE.wrong = []; saveStore(); render(); }
  };
}

function renderFav(main){
  const list = STORE.fav.map(id => QS.find(q => q.id === id)).filter(Boolean);
  if (!list.length) {
    main.innerHTML = '<div class="empty"><div class="big">☆</div>还没有收藏题目<br>答题页点右上角星标即可收藏</div>';
    return;
  }
  const html = list.map(q =>
    '<button class="item" data-id="' + q.id + '">' +
    '<span class="tag fav">' + TYPE_NAME[q.type] + '</span>' +
    '<span class="st">' + esc(q.stem) + '</span>' +
    '</button>'
  ).join('');
  main.innerHTML = '<div class="sec-title"><span>共 ' + list.length + ' 道收藏</span></div>' + html;
  main.querySelectorAll('.item').forEach(it => it.onclick = () => {
    const id = +it.dataset.id;
    S.quiz = {src:'fav', type:'fav', list:list, gIdx:0};
    S.qPos = list.findIndex(q => q.id === id); S.multiSel = [];
    render();
  });
}

/* ========== 渲染：答题页 ========== */
function renderQuiz(main){
  const list = S.quiz.list, q = list[S.qPos], answered = isAnswered(q), p = STORE.progress[q.id];
  const isFav = STORE.fav.indexOf(q.id) >= 0;
  /* 顶部：位置 + 收藏 */
  const dots = list.map((qq, i) => {
    let cls = '';
    if (i === S.qPos) cls = 'on';
    else if (STORE.progress[qq.id]) cls = STORE.progress[qq.id].ok ? 'ok' : 'bad';
    return '<i class="' + cls + '" data-pos="' + i + '"></i>';
  }).join('');
  const headHtml =
    '<div class="qhead"><div class="pos">第 ' + (S.qPos+1) + '/' + list.length + ' 题<small>' + (S.quiz.src==='group' ? ('第 ' + (S.quiz.gIdx+1) + ' 组') : (S.quiz.src==='wrong' ? '错题重练' : '收藏回顾')) + '</small></div>' +
    '<button class="favbtn' + (isFav?' on':'') + '" id="fav-btn">' + starIcon(isFav) + '</button></div>' +
    '<div class="qdots">' + dots + '</div>';
  /* 题干 */
  const qtypeCls = q.type === 'multi' ? ' qtype multi' : ' qtype';
  let html = headHtml + '<div class="qcard"><span class="' + qtypeCls.trim() + '">' + TYPE_NAME[q.type] + '</span><div class="qstem">' + esc(q.stem) + '</div>';
  /* 选项 */
  const opts = q.options.map((o, i) => {
    const L = 'ABCDEFGH'[i];
    let cls = '', lock = answered;
    if (answered) {
      const u = p.u;
      if (q.ans.indexOf(L) >= 0) cls = 'right';
      else if (u.indexOf(L) >= 0) cls = 'wrong';
      else cls = 'dim';
    } else if (q.type === 'multi' && S.multiSel.indexOf(L) >= 0) {
      cls = 'sel';
    }
    return '<button class="opt ' + cls + '"' + (answered ? ' disabled' : '') + ' data-i="' + i + '">' +
      '<span class="letter">' + L + '</span><span class="txt">' + esc(o) + '</span></button>';
  }).join('');
  html += '<div class="opts">' + opts + '</div>';
  /* 多选未答时提交按钮 */
  if (q.type === 'multi' && !answered) {
    html += '<div class="submitrow"><button class="btn-submit" id="btn-submit">提交答案</button></div>';
  }
  /* 解析（已答） */
  if (answered) {
    const ok = p.ok;
    const yours = q.type === 'judge' ? (p.u === 'A' ? '正确' : '错误') : p.u;
    html += '<div class="explain ' + (ok?'ok':'bad') + '">' +
      '<div class="e1">' + (ok ? checkIcon() : xIcon()) + '正确答案：' + esc(q.ansText) + '<span class="tagx">' + esc(q.topic) + '</span></div>' +
      (!ok ? '<div class="yours">你的答案：' + esc(yours) + '</div>' : '') +
      '<div class="ana">' + esc(cleanAna(q.analysis)) + '</div>' +
      '</div>';
  }
  html += '</div>';
  main.innerHTML = html;
  /* 事件 */
  document.getElementById('fav-btn').onclick = () => {
    const i = STORE.fav.indexOf(q.id);
    if (i >= 0) STORE.fav.splice(i, 1); else STORE.fav.push(q.id);
    saveStore(); render();
  };
  main.querySelectorAll('.qdots i').forEach(d => d.onclick = () => { S.qPos = +d.dataset.pos; S.multiSel = []; render(); });
  main.querySelectorAll('.opt').forEach(b => {
    if (answered) return;
    b.onclick = () => {
      const i = +b.dataset.i;
      if (q.type === 'multi') {
        const L = 'ABCDEFGH'[i];
        const k = S.multiSel.indexOf(L);
        if (k >= 0) S.multiSel.splice(k, 1); else S.multiSel.push(L);
        render();
      } else {
        const L = 'ABCDEFGH'[i];
        commitAnswer(q, L);
      }
    };
  });
  const sub = document.getElementById('btn-submit');
  if (sub) sub.onclick = () => { if (!S.multiSel.length) return; commitAnswer(q, S.multiSel.join('')); };
  document.getElementById('main').scrollTop = 0;
}

/* ========== 判分与存储 ========== */
function commitAnswer(q, userAns){
  const ok = sortLetters(userAns) === q.ans;
  STORE.progress[q.id] = {u:userAns, ok:ok, t:Date.now()};
  const wi = STORE.wrong.indexOf(q.id);
  if (!ok) { if (wi < 0) STORE.wrong.push(q.id); STORE.wrongAns[q.id] = userAns; }
  else if (wi >= 0) { STORE.wrong.splice(wi, 1); delete STORE.wrongAns[q.id]; }
  saveStore(); S.multiSel = []; render();
  /* 组模式答满自动弹结果 */
  if (S.quiz.src === 'group' && answeredCount(S.quiz.list) === S.quiz.list.length) {
    setTimeout(showResult, 600);
  }
}
function sortLetters(s){ return String(s).split('').sort().join(''); }

/* ========== 底部按钮 ========== */
function renderBottom(){
  const b = document.getElementById('bottom');
  if (S.tab === 'exam' && S.exam && S.exam.started) {
    const first = S.examPos === 0, last = S.examPos === S.exam.paper.length - 1;
    b.innerHTML = '<div class="in">' +
      '<button class="navbtn" id="btn-prev"' + (first?' disabled':'') + '>上一题</button>' +
      '<button class="navbtn next" id="btn-next">' + (last ? (S.exam.submitted ? '完成' : '交卷') : '下一题') + '</button>' +
      '</div>';
    document.getElementById('btn-prev').onclick = () => { if(!first){ S.examPos--; render(); } };
    document.getElementById('btn-next').onclick = () => {
      if (!last) { S.examPos++; render(); }
      else if (S.exam.submitted) { S.exam.started = false; render(); }
      else submitExam();
    };
    return;
  }
  if (!S.quiz) { b.innerHTML = ''; return; }
  const first = S.qPos === 0, last = S.qPos === S.quiz.list.length - 1;
  b.innerHTML = '<div class="in">' +
    '<button class="navbtn" id="btn-prev"' + (first?' disabled':'') + '>上一题</button>' +
    '<button class="navbtn next" id="btn-next">' + (last ? '完成并返回' : '下一题') + '</button>' +
    '</div>';
  document.getElementById('btn-prev').onclick = () => { if(!first){ S.qPos--; S.multiSel=[]; render(); } };
  document.getElementById('btn-next').onclick = () => {
    if (!last) { S.qPos++; S.multiSel=[]; render(); }
    else {
      if (S.quiz.src === 'group' && answeredCount(S.quiz.list) < S.quiz.list.length && !confirm('本组还有题目未作答，确定要返回吗？')) return;
      S.quiz = null; render();
    }
  };
}

/* ========== 结果弹窗 ========== */
function showResult(){
  const list = S.quiz.list, total = list.length;
  const cc = correctCount(list), wc = total - cc;
  const rate = total ? Math.round(cc / total * 100) : 0;
  const C = 2 * Math.PI * 52;
  document.getElementById('modal').innerHTML =
    '<h3>本组测试完成</h3>' +
    '<div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#E7ECF3" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="' + (rate>=60?'#1E8E4E':'#D14343') + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (C*rate/100) + ' ' + C + '"/></svg>' +
    '<div class="num"><b>' + rate + '%</b><span>正确率</span></div></div>' +
    '<div class="mstats"><div class="m ok"><b>' + cc + '</b>答对</div><div class="m bad"><b>' + wc + '</b>答错</div><div class="m"><b>' + total + '</b>总题数</div></div>' +
    (wc ? '<div class="mnote">' + wc + ' 道错题已自动存入错题本，可反复重练</div>' : '<div class="mnote">全部答对，表现很棒</div>') +
    '<button class="btn-done" id="btn-done">完成</button>';
  document.getElementById('mask').classList.add('show');
  document.getElementById('btn-done').onclick = () => {
    document.getElementById('mask').classList.remove('show');
    S.quiz = null; render();
  };
}

/* ========== 模拟考试 ========== */
function shuffleArr(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function newPaper(){
  return {
    paper: shuffleArr(BY_TYPE.single).slice(0, 50).concat(shuffleArr(BY_TYPE.multi).slice(0, 20), shuffleArr(BY_TYPE.judge).slice(0, 10)),
    answers: {}, submitted: false, started: false
  };
}
function saveExam(){ lsSet('quiz_exam_v1', {paper: S.exam.paper.map(q => q.id), answers: S.exam.answers, submitted: S.exam.submitted}); }
function loadExam(){
  const raw = lsGet('quiz_exam_v1', null);
  if (!raw || !raw.paper) return null;
  const paper = raw.paper.map(id => QS.find(q => q.id === id)).filter(Boolean);
  if (!paper.length) return null;
  return { paper: paper, answers: raw.answers || {}, submitted: !!raw.submitted, started: false };
}

function renderExam(main){
  if (S.exam && S.exam.started) renderExamQuiz(main);
  else renderExamIntro(main);
}

function renderExamIntro(main){
  const e = S.exam;
  let hero = '<div class="exam-hero"><h2>模拟考试</h2><p>共 80 题 · 从题库随机抽题<br>第一部分 单选 50 题 · 第二部分 多选 20 题 · 第三部分 判断 10 题<br>每题 1 分 · 满分 80 分</p>';
  let btns = '';
  const go = () => { S.exam.started = true; S.examPos = 0; render(); };
  const regen = () => {
    if (confirm('将重新随机组卷并清空当前试卷进度，确定吗？')) { S.exam = newPaper(); go(); }
  };
  if (!e) {
    btns = '<button class="btn-start" id="btn-start">开始考试</button>';
  } else if (e.submitted) {
    const score = e.paper.filter(q => sortLetters(e.answers[q.id] || '') === q.ans).length;
    hero += '<div class="scoreline">上次成绩：' + score + ' 分 / 80 分</div>';
    btns = '<div class="btn-row"><button class="btn-start" id="btn-start">查看试卷</button><button class="btn-sub" id="btn-regen">重新组卷</button></div>';
  } else {
    const n = Object.keys(e.answers).length;
    hero += '<div class="scoreline">上次考试未完成 · 已答 ' + n + '/80</div>';
    btns = '<div class="btn-row"><button class="btn-start" id="btn-start">继续考试</button><button class="btn-sub" id="btn-regen">重新组卷</button></div>';
  }
  hero += '</div>';
  main.innerHTML = hero + '<div style="margin-top:6px">' + btns + '</div>';
  const s = document.getElementById('btn-start');
  if (s) s.onclick = () => { if (!e || e.submitted) { if (!e) { S.exam = newPaper(); } go(); } else go(); };
  const r = document.getElementById('btn-regen');
  if (r) r.onclick = regen;
}

function renderExamQuiz(main){
  const paper = S.exam.paper, q = paper[S.examPos];
  const submitted = S.exam.submitted;
  const ans = S.exam.answers[q.id] || '';
  let secNo = '第一部分', sec = '单选题';
  if (S.examPos >= 50) { secNo = '第二部分'; sec = '多选题'; }
  if (S.examPos >= 70) { secNo = '第三部分'; sec = '判断题'; }
  const nAns = Object.keys(S.exam.answers).length;
  const headHtml =
    '<div class="qhead"><div class="pos">第 ' + (S.examPos + 1) + '/' + paper.length + ' 题<small>模拟考试</small></div>' +
    (submitted ? '<span class="btn-jiao" style="background:var(--ok)">已交卷</span>' : '<button class="btn-jiao" id="btn-jiao">交卷</button>') + '</div>' +
    '<div class="examprog"><span>已答 ' + nAns + '/' + paper.length + '</span><div class="bar"><i style="width:' + Math.round(nAns / paper.length * 100) + '%"></i></div></div>' +
    '<div class="examsec"><span class="secname">' + secNo + ' · ' + sec + '</span><span class="secmeta">本题为' + TYPE_NAME[q.type] + '</span></div>';
  const qtypeCls = q.type === 'multi' ? ' qtype multi' : ' qtype';
  let html = headHtml + '<div class="qcard"><span class="' + qtypeCls.trim() + '">' + TYPE_NAME[q.type] + '</span><div class="qstem">' + esc(q.stem) + '</div>';
  const opts = q.options.map((o, i) => {
    const L = 'ABCDEFGH'[i];
    let cls = '';
    if (submitted) {
      if (q.ans.indexOf(L) >= 0) cls = 'right';
      else if (ans.indexOf(L) >= 0) cls = 'wrong';
      else cls = 'dim';
    } else if (ans.indexOf(L) >= 0) {
      cls = 'sel';
    }
    return '<button class="opt ' + cls + '"' + (submitted ? ' disabled' : '') + ' data-i="' + i + '">' +
      '<span class="letter">' + L + '</span><span class="txt">' + esc(o) + '</span></button>';
  }).join('');
  html += '<div class="opts">' + opts + '</div>';
  if (submitted) {
    const ok = sortLetters(ans) === q.ans;
    const yours = q.type === 'judge' ? (ans === 'A' ? '正确' : '错误') : (ans || '未作答');
    html += '<div class="explain ' + (ok ? 'ok' : 'bad') + '">' +
      '<div class="e1">' + (ok ? checkIcon() : xIcon()) + '正确答案：' + esc(q.ansText) + '<span class="tagx">' + esc(q.topic) + '</span></div>' +
      (!ok ? '<div class="yours">你的答案：' + esc(yours) + '</div>' : '') +
      '<div class="ana">' + esc(cleanAna(q.analysis)) + '</div>' +
      '</div>';
  }
  html += '</div>';
  main.innerHTML = html;
  if (!submitted) {
    const jb = document.getElementById('btn-jiao');
    if (jb) jb.onclick = submitExam;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const L = 'ABCDEFGH'[+b.dataset.i];
      if (q.type === 'multi') {
        let cur = S.exam.answers[q.id] || '';
        if (cur.indexOf(L) >= 0) cur = cur.replace(L, '');
        else cur += L;
        if (cur) S.exam.answers[q.id] = cur; else delete S.exam.answers[q.id];
      } else {
        S.exam.answers[q.id] = L;
      }
      saveExam(); render();
    });
  }
  document.getElementById('main').scrollTop = 0;
}

function submitExam(){
  const paper = S.exam.paper;
  const unanswered = paper.filter(q => !S.exam.answers[q.id]);
  if (unanswered.length && !confirm('还有 ' + unanswered.length + ' 题未作答，确定交卷吗？')) return;
  let score = 0, s1 = 0, s2 = 0, s3 = 0;
  const corrects = [];
  paper.forEach((q, i) => {
    if (sortLetters(S.exam.answers[q.id] || '') === q.ans) {
      score++; corrects.push(q.id);
      if (i < 50) s1++; else if (i < 70) s2++; else s3++;
    }
  });
  corrects.forEach(id => { const wi = STORE.wrong.indexOf(id); if (wi >= 0) { STORE.wrong.splice(wi, 1); delete STORE.wrongAns[id]; } });
  paper.forEach(q => {
    if (corrects.indexOf(q.id) >= 0) return;
    if (STORE.wrong.indexOf(q.id) < 0) STORE.wrong.push(q.id);
    STORE.wrongAns[q.id] = S.exam.answers[q.id] || '';
  });
  S.exam.submitted = true;
  saveStore(); saveExam();
  showExamResult(score, {s1: s1, s2: s2, s3: s3}, unanswered.length);
}

function showExamResult(score, sec, unans){
  const total = S.exam.paper.length;
  const rate = Math.round(score / total * 100);
  const C = 2 * Math.PI * 52;
  document.getElementById('modal').innerHTML =
    '<h3>模拟考试完成</h3>' +
    '<div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#E7ECF3" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="' + (rate >= 60 ? '#1E8E4E' : '#D14343') + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (C * rate / 100) + ' ' + C + '"/></svg>' +
    '<div class="num"><b>' + score + '</b><span>分 / 满分 ' + total + '</span></div></div>' +
    '<div class="mstats"><div class="m ok"><b>' + sec.s1 + '</b>单选/50</div><div class="m"><b>' + sec.s2 + '</b>多选/20</div><div class="m bad"><b>' + sec.s3 + '</b>判断/10</div></div>' +
    (unans ? '<div class="mnote">' + unans + ' 题未作答 · 错题已存入错题本</div>' : '<div class="mnote">错题已存入错题本，再次答对自动移出</div>') +
    '<div class="btn-row" style="margin-top:2px"><button class="btn-ghost" id="btn-review">查看试卷</button><button class="btn-done" id="btn-done" style="flex:1">完成</button></div>';
  document.getElementById('mask').classList.add('show');
  document.getElementById('btn-review').onclick = () => {
    document.getElementById('mask').classList.remove('show');
    S.examPos = 0; render();
  };
  document.getElementById('btn-done').onclick = () => {
    document.getElementById('mask').classList.remove('show');
    S.exam.started = false; render();
  };
}

/* ========== 启动 ========== */
render();
</script>
</body>
</html>
